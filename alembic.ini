# Alembic configuration for KennaBot
# https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Path to the migration environment (env.py, script.py.mako, versions/)
script_location = src/kennabot/migrations

# Prepend sys.path so kennabot package is importable without install
prepend_sys_path = src
path_separator = :

# Separator for version_locations when multiple paths are listed (deprecated alias)
version_path_separator = :

# Version locations are set dynamically by env.py based on:
#   1. The core migrations dir (src/kennabot/migrations/versions)
#   2. All enabled plugin migrations dirs (plugins/<name>/migrations/versions)
#      filtered by KENNABOT_ENABLED_PLUGINS (empty = all discovered plugins)
#
# This value is overridden at runtime by env.py — it is listed here only so
# that `alembic revision --version-path` can resolve the path correctly when
# run from the command line.
version_locations = src/kennabot/migrations/versions:src/kennabot/plugins/plusplus/migrations/versions

# SQLAlchemy URL — overridden programmatically in env.py from kennabot settings.
# Leave blank here; it is set at runtime.
sqlalchemy.url =

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
