[project]
name = "kennabot"
version = "0.1.0"
description = "A modern Slack bot built with Python, FastAPI, and Slack Bolt"
license = { text = "MIT" }
authors = [
    { name = "QuickVM, LLC", email = "team@quickvm.com" }
]
requires-python = ">=3.12"
dependencies = [
    "slack-bolt>=1.27.0",
    "slack-sdk>=3.40.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.21.0",
    "pydantic-settings>=2.7.0",
    "typer>=0.15.0",
    "aiohttp>=3.10.0",
    "alembic>=1.14.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
import = [
    "redis>=5.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
    "ty>=0.0.1a6",
]

[project.scripts]
kennabot = "kennabot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ty]
